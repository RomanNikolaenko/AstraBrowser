<button
  class="ui-accordion__trigger"
  type="button"
  [id]="triggerId"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="panelId"
  (click)="toggle()">
  <app-icon class="ui-accordion__chevron" icon="chevron-right" />
  <span class="ui-accordion__heading">{{ heading() | t }}</span>
  @if (badge() !== undefined) {
    <span class="ui-accordion__badge">{{ badge() | t }}</span>
  }
</button>
<div class="ui-accordion__body" role="region" [id]="panelId" [attr.aria-labelledby]="triggerId" [inert]="!open()">
  <div class="ui-accordion__clip">
    <div class="ui-accordion__content">
      <ng-content />
    </div>
  </div>
</div>
