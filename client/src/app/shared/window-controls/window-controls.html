<button class="window-control" type="button" aria-label="Згорнути" title="Згорнути" (click)="minimizeWindow()">
  <app-icon icon="minimize" />
</button>
<button
  class="window-control"
  type="button"
  [attr.aria-label]="isMaximized() ? 'Відновити' : 'Розгорнути'"
  [attr.title]="isMaximized() ? 'Відновити' : 'Розгорнути'"
  (click)="toggleMaximizeWindow()">
  @if (isMaximized()) {
    <app-icon icon="restore" />
  } @else {
    <app-icon icon="maximize" />
  }
</button>
<button class="window-control window-control--close" type="button" aria-label="Закрити" title="Закрити" (click)="closeWindow()">
  <app-icon icon="close" />
</button>
