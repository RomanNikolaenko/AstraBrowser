<button
  class="ui-select__trigger"
  type="button"
  role="combobox"
  aria-haspopup="listbox"
  [attr.id]="selectId() ?? null"
  [attr.aria-label]="ariaLabel() ?? null"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="listId"
  [attr.aria-activedescendant]="open() && active() >= 0 ? optionId(active()) : null"
  [attr.popovertarget]="listId"
  [disabled]="disabled()"
  (keydown)="onKeydown($event)">
  <span class="ui-select__value">{{ selected()?.label }}</span>
  <app-icon class="ui-select__chevron" icon="chevron-down" />
</button>

@if (selectName(); as name) {
  <input type="hidden" [name]="name" [value]="value() ?? ''" />
}

<div class="ui-select__list" #list popover role="listbox" data-drag-region="false" [id]="listId" (toggle)="onToggle($event)">
  @for (option of options(); track option.value; let index = $index) {
    <!-- Пункти не беруть фокус: він лишається на кнопці-комбобоксі, а пункт під курсором — aria-activedescendant (шаблон WAI-ARIA). -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div
      class="ui-select__option"
      role="option"
      [id]="optionId(index)"
      [attr.aria-selected]="option.value === value()"
      [class.ui-select__option--active]="index === active()"
      (pointermove)="hover(index)"
      (mousedown)="$event.preventDefault()"
      (click)="choose(index)">
      <span>{{ option.label }}</span>
      @if (option.value === value()) {
        <app-icon class="ui-select__check" icon="check" />
      }
    </div>
  }
</div>
