<div class="auth__step">
  <span class="auth__step-icon"><app-icon icon="email" /></span>
  <h2 class="auth__step-title">Вхід за кодом</h2>
  <p class="auth__step-text">
    Ми надіслали лист із кодом на <strong class="auth__step-email">{{ email() }}</strong
    >. Введіть код, щоб увійти без пароля.
  </p>
</div>

@if (error(); as message) {
  <p class="auth__alert auth__alert--error" role="alert"><app-icon icon="alert" />{{ message }}</p>
} @else if (notice(); as message) {
  <p class="auth__alert" role="status"><app-icon icon="check" />{{ message }}</p>
}

<form class="auth__fields" id="sign-in-code-form" novalidate (submit)="submit($event)">
  <div class="auth__field-label">
    <span class="auth__field-name">Код із листа</span>
    <app-input
      class="auth__input"
      icon="key"
      inputId="sign-in-code"
      inputName="code"
      [(value)]="code.value"
      [(touched)]="code.touched"
      [error]="code.visibleError()"
      ariaLabel="Код із листа"
      autocomplete="one-time-code"
      enterKeyHint="done"
      placeholder="123456" />
  </div>
</form>
<button class="auth__submit" type="submit" form="sign-in-code-form" [disabled]="busy()">
  {{ busy() ? 'Входимо…' : 'Увійти' }} <app-icon icon="arrow-right" />
</button>

<div class="auth__inline-actions">
  <button class="auth__link" type="button" [disabled]="cooldown.seconds() > 0" (click)="resend()">
    @if (cooldown.seconds() > 0) {
      Надіслати ще раз за {{ cooldown.seconds() }} с
    } @else {
      Надіслати код ще раз
    }
  </button>
  <button class="auth__link" type="button" (click)="back.emit()">Увійти з паролем</button>
</div>
