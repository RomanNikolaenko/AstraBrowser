<div #list class="omnibox-suggestions" popover="manual" role="listbox" aria-label="Підказки" [id]="listId">
  @for (suggestion of suggestions(); track $index; let index = $index) {
    <!-- Пункти не беруть фокус: він лишається в адресному рядку, а вибраний пункт — aria-activedescendant. -->
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
    <div
      class="omnibox-suggestions__item"
      role="option"
      [id]="optionId(index)"
      [attr.aria-selected]="index === selected()"
      [class.omnibox-suggestions__item--selected]="index === selected()"
      (mousedown)="keepFocus($event)"
      (mouseenter)="highlight.emit(index)"
      (click)="pick.emit(suggestion)">
      <span class="omnibox-suggestions__icon">
        @if (icon(suggestion); as name) {
          <app-icon [icon]="name" />
        } @else if (siteUrl(suggestion); as url) {
          <app-site-icon [url]="url" [size]="16" />
        }
      </span>
      <span class="omnibox-suggestions__text">
        <span class="omnibox-suggestions__title">{{ suggestion.title }}</span>
        <span class="omnibox-suggestions__detail">
          @if (suggestion.kind === 'bookmark') {
            <app-icon class="omnibox-suggestions__badge" icon="star-filled" />
          }
          {{ suggestion.detail }}
        </span>
      </span>
    </div>
  }
</div>
