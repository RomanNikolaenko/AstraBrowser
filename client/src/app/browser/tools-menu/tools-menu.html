<app-popover class="tools-menu" popoverId="tools-menu" caret>
  <h2 class="tools-menu__title">{{ 'Інструменти' | t }}</h2>
  <ul class="tools-menu__grid">
    @for (tool of tools; track tool.label) {
      <li>
        <button
          class="tools-menu__tile"
          type="button"
          popovertarget="tools-menu"
          popovertargetaction="hide"
          [title]="tool.shortcut ? (tool.label | t) + ' (' + tool.shortcut + ')' : (tool.label | t)"
          (click)="run(tool)">
          <app-icon class="tools-menu__icon" [icon]="tool.icon" />
          <span>{{ tool.label | t }}</span>
        </button>
      </li>
    }
  </ul>
</app-popover>
