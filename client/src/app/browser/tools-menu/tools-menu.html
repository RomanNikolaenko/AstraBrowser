<app-popover class="tools-menu" popoverId="tools-menu" caret>
  <h2 class="tools-menu__title">Інструменти</h2>
  <ul class="tools-menu__grid">
    @for (tool of tools; track tool.label) {
      <li>
        <button class="tools-menu__tile" type="button" popovertarget="tools-menu" popovertargetaction="hide" (click)="run(tool)">
          <app-icon class="tools-menu__icon" [icon]="tool.icon" />
          <span>{{ tool.label }}</span>
        </button>
      </li>
    }
  </ul>
</app-popover>
