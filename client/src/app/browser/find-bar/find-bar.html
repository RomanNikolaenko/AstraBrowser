<div class="find-bar" role="search">
  <app-input
    class="find-bar__field"
    icon="search"
    inputId="find-on-page"
    inputName="find-on-page"
    [ariaLabel]="'Знайти на сторінці' | t"
    [placeholder]="'Знайти на сторінці' | t"
    autocomplete="off"
    [spellcheck]="false"
    enterKeyHint="search"
    [(value)]="query"
    (keydown)="onKeydown($event)">
    <output class="find-bar__status" [class.find-bar__status--empty]="notFound()" aria-live="polite">{{ status() }}</output>
  </app-input>
  <span class="find-bar__divider" aria-hidden="true"></span>
  <button
    class="find-bar__button"
    type="button"
    [attr.aria-label]="'Попередній збіг' | t"
    [title]="'Попередній збіг (Shift+Enter)' | t"
    [disabled]="!canStep()"
    (click)="previous()">
    <app-icon icon="chevron-up" />
  </button>
  <button
    class="find-bar__button"
    type="button"
    [attr.aria-label]="'Наступний збіг' | t"
    [title]="'Наступний збіг (Enter)' | t"
    [disabled]="!canStep()"
    (click)="next()">
    <app-icon icon="chevron-down" />
  </button>
  <button
    class="find-bar__button"
    type="button"
    [attr.aria-label]="'Закрити пошук' | t"
    [title]="'Закрити (Esc)' | t"
    (click)="closed.emit()">
    <app-icon icon="close" />
  </button>
</div>
