<section class="new-tab">
  <h1 class="new-tab__brand">
    <img class="new-tab__logo" src="/logo.webp" alt="" width="104" height="104" fetchpriority="high" />
    <span class="new-tab__name"><strong>Astra</strong> Browser</span>
  </h1>

  <form class="search-form" role="search" (submit)="submit($event)">
    <app-input
      class="search"
      size="lg"
      shape="pill"
      icon="search"
      inputId="new-tab-search"
      inputName="query"
      [ariaLabel]="'Пошук у Astra або адреса сайту' | t"
      [placeholder]="'Пошук у Astra або введіть адресу сайту...' | t"
      autocomplete="off"
      enterKeyHint="search"
      [(value)]="query" />
  </form>
</section>
