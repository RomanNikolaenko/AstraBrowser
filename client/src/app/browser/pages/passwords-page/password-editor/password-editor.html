<dialog #dialog class="password-editor" aria-labelledby="password-editor-title" closedby="any" (close)="onClose()">
  <form class="password-editor__panel" novalidate (submit)="save($event)">
    <h2 class="password-editor__title" id="password-editor-title">{{ editing() ? 'Змінити пароль' : 'Додати пароль' }}</h2>

    @if (editing(); as entry) {
      <div class="password-editor__site">
        <app-site-icon class="password-editor__site-icon" [url]="entry.origin" [size]="20" />
        <span class="password-editor__site-name">{{ hostname(entry.origin) }}</span>
      </div>
    } @else {
      <app-input
        #siteInput
        class="password-editor__field"
        icon="globe"
        inputId="password-editor-site"
        inputName="site"
        type="url"
        ariaLabel="Сайт"
        placeholder="Сайт, наприклад example.com"
        autocomplete="off"
        [spellcheck]="false"
        [(value)]="site.value"
        [(touched)]="site.touched"
        [error]="site.visibleError()" />
    }
    <app-input
      #usernameInput
      class="password-editor__field"
      icon="user"
      inputId="password-editor-username"
      inputName="username"
      ariaLabel="Ім'я користувача"
      placeholder="Ім'я користувача чи пошта"
      autocomplete="off"
      [spellcheck]="false"
      [(value)]="username" />
    <app-input
      class="password-editor__field"
      icon="lock"
      inputId="password-editor-password"
      inputName="password"
      ariaLabel="Пароль"
      placeholder="Пароль"
      autocomplete="new-password"
      [spellcheck]="false"
      [type]="passwordVisible() ? 'text' : 'password'"
      [(value)]="password.value"
      [(touched)]="password.touched"
      [error]="password.visibleError()">
      <button
        class="password-editor__toggle"
        type="button"
        [attr.aria-label]="passwordVisible() ? 'Приховати пароль' : 'Показати пароль'"
        [title]="passwordVisible() ? 'Приховати пароль' : 'Показати пароль'"
        (click)="passwordVisible.set(!passwordVisible())">
        <app-icon [icon]="passwordVisible() ? 'eye' : 'eye-hide'" />
      </button>
    </app-input>
    <button class="password-editor__generate" type="button" (click)="generate()">
      <app-icon icon="sparkle" />
      Згенерувати надійний пароль
    </button>

    @if (error()) {
      <p class="password-editor__error" role="alert">{{ error() }}</p>
    }

    <div class="password-editor__actions">
      <button class="password-editor__button" type="button" (click)="close()">Скасувати</button>
      <button class="password-editor__button password-editor__button--primary" type="submit" [disabled]="saving()">
        Зберегти
      </button>
    </div>
  </form>
</dialog>
