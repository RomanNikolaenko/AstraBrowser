<dialog #dialog class="password-prompt" aria-labelledby="password-prompt-title" closedby="any" (close)="onClose()">
  @if (request(); as request) {
    <form class="password-prompt__panel" novalidate (submit)="save($event)">
      <div class="password-prompt__head">
        <span class="password-prompt__icon"><app-icon icon="key" /></span>
        <span class="password-prompt__text">
          <h2 class="password-prompt__title" id="password-prompt-title">
            {{ request.update ? ('Оновити пароль?' | t) : ('Зберегти пароль?' | t) }}
          </h2>
          <span class="password-prompt__site">{{ hostname(request.origin) }}</span>
        </span>
      </div>

      <app-input
        class="password-prompt__field"
        icon="user"
        inputId="password-prompt-username"
        inputName="username"
        [ariaLabel]="'Ім\'я користувача' | t"
        [placeholder]="'Ім\'я користувача' | t"
        autocomplete="off"
        [spellcheck]="false"
        [(value)]="username" />
      <app-input
        class="password-prompt__field"
        icon="lock"
        inputId="password-prompt-password"
        inputName="password"
        [ariaLabel]="'Пароль' | t"
        [placeholder]="'Пароль' | t"
        autocomplete="off"
        [spellcheck]="false"
        [type]="passwordVisible() ? 'text' : 'password'"
        [(value)]="password">
        <button
          class="password-prompt__toggle"
          type="button"
          [attr.aria-label]="passwordVisible() ? ('Приховати пароль' | t) : ('Показати пароль' | t)"
          [title]="passwordVisible() ? ('Приховати пароль' | t) : ('Показати пароль' | t)"
          (click)="passwordVisible.set(!passwordVisible())">
          <app-icon [icon]="passwordVisible() ? 'eye' : 'eye-hide'" />
        </button>
      </app-input>

      <p class="password-prompt__note">{{ "Пароль зберігається зашифрованим лише на цьому комп'ютері." | t }}</p>

      <div class="password-prompt__actions">
        @if (!request.update) {
          <button class="password-prompt__never" type="button" (click)="never()">{{ 'Ніколи для цього сайту' | t }}</button>
        }
        <button class="password-prompt__button" type="button" (click)="dismiss()">{{ 'Не зараз' | t }}</button>
        <!-- Фокус одразу на головній дії: Enter зберігає, Esc — «не зараз». -->
        <button class="password-prompt__button password-prompt__button--primary" type="submit" autofocus>
          {{ request.update ? ('Оновити' | t) : ('Зберегти' | t) }}
        </button>
      </div>
    </form>
  }
</dialog>
