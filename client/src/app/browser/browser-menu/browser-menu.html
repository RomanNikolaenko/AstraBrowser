<app-popover class="menu" popoverId="browser-menu" caret (opened)="updates.markSeen()">
  <div class="menu__scroll">
    @for (section of sections; track $index) {
      @if ($index === zoomSectionIndex) {
        <div class="menu__section menu__zoom">
          <span class="menu__zoom-label" id="browser-menu-zoom">{{ 'Масштаб' | t }}</span>
          <div class="menu__zoom-control" role="group" aria-labelledby="browser-menu-zoom">
            <button
              class="menu__zoom-button"
              type="button"
              [attr.aria-label]="'Зменшити масштаб' | t"
              [title]="'Зменшити масштаб' | t"
              [disabled]="!canZoomOut()"
              (click)="zoomOut()">
              <app-icon icon="minus" />
            </button>
            <output class="menu__zoom-value" aria-live="polite">{{ zoom() }}%</output>
            <button
              class="menu__zoom-button"
              type="button"
              [attr.aria-label]="'Збільшити масштаб' | t"
              [title]="'Збільшити масштаб' | t"
              [disabled]="!canZoomIn()"
              (click)="zoomIn()">
              <app-icon icon="plus" />
            </button>
          </div>
          <button
            class="menu__zoom-button menu__fullscreen"
            type="button"
            [attr.aria-label]="'Повноекранний режим' | t"
            [title]="'Повноекранний режим' | t"
            popovertarget="browser-menu"
            popovertargetaction="hide"
            (click)="fullscreen.emit()">
            <app-icon icon="fullscreen" />
          </button>
        </div>
      }

      <div class="menu__section">
        @for (item of section; track item.label) {
          <button
            class="menu__item"
            type="button"
            popovertarget="browser-menu"
            popovertargetaction="hide"
            [attr.aria-keyshortcuts]="item.keys ?? null"
            (click)="run(item)">
            <app-icon class="menu__icon" [icon]="item.icon" />
            <span class="menu__label">{{ item.label | t }}</span>
            @if (item.shortcut) {
              <kbd class="menu__shortcut" aria-hidden="true">{{ item.shortcut }}</kbd>
            }
          </button>
        }
      </div>
    }

    <!-- Меню лишається відкритим: видно, як іде завантаження оновлення. -->
    <div class="menu__section">
      <button
        class="menu__item menu__update"
        type="button"
        [class.menu__update--available]="updates.available() && !updates.installing()"
        [disabled]="!updates.canInstall()"
        [attr.title]="updateTitle() | t"
        (click)="updates.install()">
        <app-icon class="menu__icon" icon="update" />
        <span class="menu__label">{{ updateLabel() | t }}</span>
        @if (updates.installing()) {
          @if (updates.percent() !== null) {
            <span class="menu__version">{{ updates.percent() }}%</span>
          }
        } @else if (updates.available(); as update) {
          <span class="menu__version menu__version--new">{{ update.version }}</span>
        } @else if (updates.current(); as current) {
          <span class="menu__version">{{ current }}</span>
        }
      </button>
    </div>
  </div>
</app-popover>
