<app-popover class="popup-blocked" popoverId="popup-blocked" align="end" caret>
  <h2 class="popup-blocked__title">Спливне вікно заблоковано</h2>
  <p class="popup-blocked__text">{{ host() }} хотів відкрити вікно без вашого кліку:</p>
  <ul class="popup-blocked__list">
    @for (url of popups(); track url) {
      <li>
        <button class="popup-blocked__item" type="button" [title]="url" (click)="openPopup(url)">
          <app-icon class="popup-blocked__icon" icon="popup" />
          <span class="popup-blocked__url">{{ url }}</span>
        </button>
      </li>
    }
  </ul>
  <label class="popup-blocked__allow">
    <input type="checkbox" name="allow-popups" [checked]="allowed()" (change)="setAllowed($event)" />
    Завжди дозволяти спливні вікна з {{ host() }}
  </label>
  <div class="popup-blocked__actions">
    <button class="popup-blocked__button" type="button" (click)="close()">Готово</button>
  </div>
</app-popover>
