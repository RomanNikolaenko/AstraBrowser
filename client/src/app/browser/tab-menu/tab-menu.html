<span #anchor class="tab-menu__anchor"></span>
<app-popover class="tab-menu" popoverId="tab-menu" align="start">
  <ul class="tab-menu__list" role="menu" [attr.aria-label]="'Вкладка' | t" tabindex="-1" (keydown)="onKeydown($event)">
    <li role="none">
      <button #item class="tab-menu__item" type="button" role="menuitem" (click)="run('new-tab-right')">
        {{ 'Нова вкладка праворуч' | t }}
      </button>
    </li>
    <li class="tab-menu__separator" role="separator"></li>
    @if (target().site) {
      <li role="none">
        <button #item class="tab-menu__item" type="button" role="menuitem" (click)="run('reload')">
          {{ 'Перезавантажити' | t }}
        </button>
      </li>
    }
    <li role="none">
      <button #item class="tab-menu__item" type="button" role="menuitem" (click)="run('duplicate')">{{ 'Дублювати' | t }}</button>
    </li>
    <li role="none">
      <button #item class="tab-menu__item" type="button" role="menuitem" (click)="run(target().pinned ? 'unpin' : 'pin')">
        {{ target().pinned ? ('Відкріпити' | t) : ('Закріпити' | t) }}
      </button>
    </li>
    @if (target().site) {
      <li role="none">
        <button #item class="tab-menu__item" type="button" role="menuitem" (click)="run(target().muted ? 'unmute' : 'mute')">
          {{ target().muted ? ('Увімкнути звук сайту' | t) : ('Вимкнути звук сайту' | t) }}
        </button>
      </li>
    }
    <li class="tab-menu__separator" role="separator"></li>
    <li role="none">
      <button
        #item
        class="tab-menu__item"
        type="button"
        role="menuitem"
        [disabled]="!target().others"
        (click)="run('new-window')">
        {{ 'Перемістити в нове вікно' | t }}
      </button>
    </li>
    <li class="tab-menu__separator" role="separator"></li>
    <li role="none">
      <button #item class="tab-menu__item" type="button" role="menuitem" (click)="run('close')">
        <span>{{ 'Закрити' | t }}</span
        ><span class="tab-menu__shortcut">Ctrl+W</span>
      </button>
    </li>
    <li role="none">
      <button
        #item
        class="tab-menu__item"
        type="button"
        role="menuitem"
        [disabled]="!target().others"
        (click)="run('close-others')">
        {{ 'Закрити інші вкладки' | t }}
      </button>
    </li>
    <li role="none">
      <button
        #item
        class="tab-menu__item"
        type="button"
        role="menuitem"
        [disabled]="!target().right"
        (click)="run('close-right')">
        {{ 'Закрити вкладки праворуч' | t }}
      </button>
    </li>
  </ul>
</app-popover>
