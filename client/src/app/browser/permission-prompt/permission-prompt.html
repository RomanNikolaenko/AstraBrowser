<app-popover class="permission-prompt" popoverId="permission-prompt" align="start" caret (closed)="onClosed()">
  @if (request(); as request) {
    @if (info(); as info) {
      <h2 class="permission-prompt__title">{{ site() }} хоче:</h2>
      <p class="permission-prompt__ask">
        <app-icon class="permission-prompt__icon" [icon]="info.icon" />
        <span>{{ info.asks }}</span>
      </p>
      <div class="permission-prompt__actions">
        <button
          class="permission-prompt__button permission-prompt__button--primary"
          type="button"
          (click)="answer('allow', true)">
          Дозволяти на цьому сайті
        </button>
        <button class="permission-prompt__button" type="button" (click)="answer('allow', false)">Дозволити цього разу</button>
        <button class="permission-prompt__button" type="button" (click)="answer('deny', true)">Не дозволяти</button>
      </div>
    }
  }
</app-popover>
