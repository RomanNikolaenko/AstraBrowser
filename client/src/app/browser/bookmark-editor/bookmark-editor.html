<app-popover class="bookmark-editor" popoverId="bookmark-editor" caret (opened)="onOpened()">
  <h2 class="bookmark-editor__title">{{ existing() ? 'Редагувати закладку' : 'Додати закладку' }}</h2>
  <form class="bookmark-editor__form" novalidate (submit)="save($event)">
    <app-input #titleInput class="bookmark-editor__field" icon="star" inputId="bookmark-editor-title" inputName="title" ariaLabel="Назва закладки" placeholder="Назва" autocomplete="off" [(value)]="title.value" [(touched)]="title.touched" [error]="title.visibleError()" />
    <app-input class="bookmark-editor__field" icon="globe" inputId="bookmark-editor-url" inputName="url" type="url" ariaLabel="Адреса сайту" placeholder="example.com" autocomplete="url" [spellcheck]="false" [(value)]="url.value" [(touched)]="url.touched" [error]="url.visibleError()" />
    <div class="bookmark-editor__actions">
      @if (existing()) {
        <button class="bookmark-editor__button bookmark-editor__button--danger bookmark-editor__remove" type="button" (click)="remove()">Видалити</button>
      }
      <button class="bookmark-editor__button" type="button" popovertarget="bookmark-editor" popovertargetaction="hide">Скасувати</button>
      <button class="bookmark-editor__button bookmark-editor__button--primary" type="submit">Зберегти</button>
    </div>
  </form>
</app-popover>
