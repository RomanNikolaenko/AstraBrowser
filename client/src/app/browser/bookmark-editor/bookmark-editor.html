<app-popover class="bookmark-editor" popoverId="bookmark-editor" caret (opened)="onOpened()">
  <h2 class="bookmark-editor__title">{{ existing() ? ('Редагувати закладку' | t) : ('Додати закладку' | t) }}</h2>
  <form class="bookmark-editor__form" novalidate (submit)="save($event)">
    <app-input
      #titleInput
      class="bookmark-editor__field"
      icon="star"
      inputId="bookmark-editor-title"
      inputName="title"
      [ariaLabel]="'Назва закладки' | t"
      [placeholder]="'Назва' | t"
      autocomplete="off"
      [(value)]="title.value"
      [(touched)]="title.touched"
      [error]="title.visibleError()" />
    <app-input
      class="bookmark-editor__field"
      icon="globe"
      inputId="bookmark-editor-url"
      inputName="url"
      type="url"
      [ariaLabel]="'Адреса сайту' | t"
      placeholder="example.com"
      autocomplete="url"
      [spellcheck]="false"
      [(value)]="url.value"
      [(touched)]="url.touched"
      [error]="url.visibleError()" />
    @if (folderOptions().length > 1) {
      <div class="bookmark-editor__folder">
        <span class="bookmark-editor__label" id="bookmark-editor-folder-label">{{ 'Тека' | t }}</span>
        <app-select
          class="bookmark-editor__select"
          selectId="bookmark-editor-folder"
          ariaLabelledby="bookmark-editor-folder-label"
          selectName="folder"
          [options]="folderOptions()"
          [(value)]="folder" />
      </div>
    }
    <div class="bookmark-editor__actions">
      @if (existing()) {
        <button
          class="bookmark-editor__button bookmark-editor__button--danger bookmark-editor__remove"
          type="button"
          (click)="remove()">
          {{ 'Видалити' | t }}
        </button>
      }
      <button class="bookmark-editor__button" type="button" popovertarget="bookmark-editor" popovertargetaction="hide">
        {{ 'Скасувати' | t }}
      </button>
      <button class="bookmark-editor__button bookmark-editor__button--primary" type="submit">{{ 'Зберегти' | t }}</button>
    </div>
  </form>
</app-popover>
