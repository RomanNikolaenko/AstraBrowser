<div
  #panel
  class="popover"
  popover
  [id]="popoverId()"
  [class.popover--start]="align() === 'start'"
  [class.popover--caret]="caret()"
  [class.popover--side]="placement() === 'side'"
  [style.position-anchor]="'--' + popoverId()"
  (beforetoggle)="onBeforeToggle($event)"
  (toggle)="onToggle($event)">
  <ng-content />
</div>
