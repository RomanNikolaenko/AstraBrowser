# Перевірки на кожен пуш у main і pull request: форматування, лінтери, переклад, тести й збірка інтерфейсу,
# тести й clippy Rust (обидва профілі) на Windows і Linux. Секретів не потрібно — ключа підпису тут немає.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новий пуш у ту саму гілку скасовує ще не завершену перевірку попереднього.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Інтерфейс
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Залежності
        run: npm ci

      - name: Форматування
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:styles

      # Кожен текст інтерфейсу має англійський переклад (client/src/app/shared/i18n/en.ts).
      - name: Переклад
        run: npm run i18n:check

      # Іконки вбудовані в збірку: src/app/shared/ui-icon/icons.ts має відповідати src/assets/icons.
      - name: Іконки
        run: npm run icons -- --check

      - name: Тести
        run: npx ng test --watch=false

      - name: Збірка
        run: npm run build

  server:
    name: Rust (${{ matrix.name }})
    # У кожної системи свій рушій сторінок (WebView2 чи WebKitGTK) і свій код — перевіряємо обидві. Windows збирає
    # утричі довше, тож її тести, clippy і clippy для релізу йдуть паралельно, кожен на своїй машині й зі своїм кешем;
    # Linux і так швидкий — усе разом.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows, тести
            os: windows-latest
            cache: test
            run: cargo test
          - name: windows, clippy
            os: windows-latest
            cache: clippy
            run: cargo clippy --all-targets -- -D warnings
          # Частина коду — лише в релізі (скажімо, інструменти розробника закриті для інтерфейсу браузера).
          - name: windows, clippy (реліз)
            os: windows-latest
            cache: clippy-release
            run: cargo clippy --release -- -D warnings
          # Та сама Ubuntu, що й у збірці випуску (release.yml).
          - name: linux
            os: ubuntu-22.04
            cache: all
            run: |
              cargo test
              cargo clippy --all-targets -- -D warnings
              cargo clippy --release -- -D warnings
    runs-on: ${{ matrix.os }}
    # Інкрементальна збірка й налагоджувальна інформація в CI лише сповільнюють: кеш target роздувається, а Windows ще й
    # довго лінкує PDB.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      # WebKitGTK, GTK і решта, з чим збирається Linux-версія (як у release.yml).
      - name: Бібліотеки Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Кеш Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-ci-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-${{ matrix.cache }}-

      # generate_context! вбудовує зібраний інтерфейс (frontendDist): без нього Rust не компілюється.
      - name: Збірка інтерфейсу
        working-directory: client
        run: |
          npm ci
          npm run build

      # Серед тестів — і перевірка, що client/src/app/bindings.ts відповідає командам Rust.
      - name: Перевірка
        working-directory: server
        run: ${{ matrix.run }}
