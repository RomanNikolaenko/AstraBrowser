# Перевірки на кожен пуш у main і pull request. Інтерфейс: вразливості залежностей (pnpm audit), форматування (Oxfmt),
# Oxlint, ESLint (angular-eslint), Stylelint, переклад, тести й збірка. Rust: форматування (rustfmt), вразливості залежностей (cargo-audit), тести й
# Clippy (обидва профілі) на Windows і Linux. Секретів не потрібно — ключа підпису тут немає.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новий пуш у ту саму гілку скасовує ще не завершену перевірку попереднього.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Інтерфейс
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      # pnpm (версія — packageManager у client/package.json) і Node.js; кеш сховища pnpm — за client/pnpm-lock.yaml.
      - name: pnpm і Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: client
          runtime: node@24
          cache: true
          cache-dependency-path: client/pnpm-lock.yaml
          install: false

      - name: Залежності
        run: pnpm install --frozen-lockfile

      # Відомі вразливості бібліотек, що потрапляють у збірку інтерфейсу (dependencies), — тоді падає.
      - name: Вразливості залежностей (pnpm audit)
        run: pnpm audit --prod --audit-level=moderate

      - name: Форматування (Oxfmt)
        run: pnpm run format:check

      - name: Oxlint
        run: pnpm run lint:ox

      # Правила Angular — для TypeScript і шаблонів; загальні JS/TS тут вимкнені (їх перевіряє Oxlint).
      - name: ESLint (angular-eslint)
        run: pnpm run lint

      - name: Stylelint
        run: pnpm run lint:styles

      # Кожен текст інтерфейсу має англійський переклад (client/src/app/shared/i18n/en.ts).
      - name: Переклад
        run: pnpm run i18n:check

      # Іконки вбудовані в збірку: src/app/shared/ui-icon/icons.ts має відповідати src/assets/icons.
      - name: Іконки
        run: pnpm run icons --check

      - name: Тести
        run: pnpm run test:ci

      - name: Збірка
        run: pnpm run build

  # Без збірки: rustfmt і cargo-audit читають лише код і Cargo.lock.
  rust-checks:
    name: Rust (форматування й аудит)
    runs-on: ubuntu-latest
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - name: rustfmt
        run: cargo fmt --check

      # cargo-audit збирається з коду кілька хвилин, тож сам інструмент — з кешу (ключ — його версія).
      - name: Кеш cargo-audit
        id: cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Встановити cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}

      # Відомі вразливості й відкликані версії залежностей (база RustSec) — тоді падає. Попередження (непідтримувані
      # бібліотеки в залежностях Tauri й GTK) лише виводяться.
      - name: cargo-audit
        run: cargo audit

  server:
    name: Rust (${{ matrix.name }})
    # У кожної системи свій рушій сторінок (WebView2 чи WebKitGTK) і свій код — перевіряємо обидві. Windows збирає
    # утричі довше, тож її тести, clippy і clippy для релізу йдуть паралельно, кожен на своїй машині й зі своїм кешем;
    # Linux і так швидкий — усе разом.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows, тести
            os: windows-latest
            cache: test
            run: cargo test
          - name: windows, clippy
            os: windows-latest
            cache: clippy
            run: cargo clippy --all-targets -- -D warnings
          # Частина коду — лише в релізі (скажімо, інструменти розробника закриті для інтерфейсу браузера).
          - name: windows, clippy (реліз)
            os: windows-latest
            cache: clippy-release
            run: cargo clippy --release -- -D warnings
          # Та сама Ubuntu, що й у збірці випуску (release.yml).
          - name: linux
            os: ubuntu-22.04
            cache: all
            run: |
              cargo test
              cargo clippy --all-targets -- -D warnings
              cargo clippy --release -- -D warnings
    runs-on: ${{ matrix.os }}
    # Інкрементальна збірка й налагоджувальна інформація в CI лише сповільнюють: кеш target роздувається, а Windows ще й
    # довго лінкує PDB.
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      # WebKitGTK, GTK і решта, з чим збирається Linux-версія (як у release.yml).
      - name: Бібліотеки Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      # pnpm (версія — packageManager у client/package.json) і Node.js; кеш сховища pnpm — за client/pnpm-lock.yaml.
      - name: pnpm і Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: client
          runtime: node@24
          cache: true
          cache-dependency-path: client/pnpm-lock.yaml
          install: false

      - name: Кеш Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-ci-${{ runner.os }}-${{ matrix.cache }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-${{ matrix.cache }}-

      # generate_context! вбудовує зібраний інтерфейс (frontendDist): без нього Rust не компілюється.
      - name: Збірка інтерфейсу
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Серед тестів — і перевірка, що client/src/app/bindings.ts відповідає командам Rust.
      - name: Перевірка
        working-directory: server
        run: ${{ matrix.run }}
