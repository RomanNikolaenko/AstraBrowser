# Випуск оновлення: підняти version у server/tauri.conf.json, запушити, потім
#   git tag -a v0.2.0 -m "Що нового" && git push origin v0.2.0
# Збирає інсталятор Windows і пакети Linux (.deb, .rpm, AppImage), підписує їх ключем оновлень (секрет
# TAURI_SIGNING_PRIVATE_KEY) і публікує реліз з latest.json — з нього кнопка «Оновити Astra Browser» дізнається про нову
# версію. Докладно — RELEASING.md.
#
# Лише дії самого GitHub (actions/*): у цієї збірки є доступ до ключа підпису.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Збірка (${{ matrix.system }})
    strategy:
      matrix:
        include:
          - system: windows
            os: windows-latest
          # Найстаріша Ubuntu з WebKitGTK 4.1: пакети з її glibc ставляться й на новіші системи.
          - system: linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # checkout приносить тег без його повідомлення, а з нього — «Що нового».
      - name: Повідомлення тегу
        shell: bash
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Тег збігається з версією
        shell: bash
        run: |
          version=$(node -p "require('./server/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в server/tauri.conf.json версія $version. Підніміть version або перейменуйте тег."
            exit 1
          fi

      # WebKitGTK, GTK і решта, з чим збирається Linux-версія (як у вимогах Tauri).
      - name: Бібліотеки Linux
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm тієї версії, що в packageManager (client/package.json), — з реєстру npm, без сторонніх дій. Його
      # скрипт встановлення (рідний бінарник замість запуску через Node.js) нові npm запускають лише з --allow-scripts.
      - name: pnpm
        shell: bash
        run: |
          npm install -g "$(node -p "require('./client/package.json').packageManager")" --allow-scripts=pnpm
          echo "PNPM_STORE=$(pnpm --dir client store path)" >> "$GITHUB_ENV"

      - name: Кеш pnpm
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: pnpm-release-${{ runner.os }}-

      - name: Кеш Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Залежності
        working-directory: client
        run: pnpm install --frozen-lockfile

      # Кожен текст інтерфейсу має англійський переклад (client/src/app/shared/i18n/en.ts).
      - name: Переклад
        working-directory: client
        run: pnpm run i18n:check

      - name: Збірка й підпис
        working-directory: client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export RELEASE_NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          pnpm run release

      # Пакети й latest.json цієї системи, як їх склав pnpm run release (client/scripts/release.mjs).
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.system }}
          path: server/target/release/bundle/release/
          if-no-files-found: error

  publish:
    name: Реліз
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Повідомлення тегу
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: parts

      # Один latest.json на всі системи — і всі пакети поруч.
      - name: Файли релізу
        run: node client/scripts/release.mjs --merge release parts/release-windows parts/release-linux

      - name: Реліз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./server/tauri.conf.json').version")
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" release/* --title "Astra Browser $version" --notes "${notes:-Astra Browser $version}"
