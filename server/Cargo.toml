[package]
name = "astra-browser"
version = "0.1.0"
description = "Astra Browser desktop application"
authors = ["Astra Browser"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adblock = { version = "0.13.3", default-features = false, features = ["css-validation", "embedded-domain-resolver", "full-regex-handling"] }
ureq = "3"
base64 = "0.22"
regex = "1"
tauri-plugin-dialog = "2"
# Розмір, положення й розгорнутість головного вікна між запусками.
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# Наскрізне шифрування паролів для синхронізації: AES-256-GCM і HMAC (сам ключ з пароля — PBKDF2 Windows, secure.rs).
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# Перевірка, що PBKDF2 Windows рахує так само, як незалежна реалізація.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# Звук, іконки й дозволи сайтів — через WebView2 напряму, повноекранне вікно — через Win32 (ті самі версії, що й у Tauri/wry).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"

# Рушій блокувальника реклами розбирає десятки тисяч правил — і в debug-збірці його варто оптимізувати.
[profile.dev.package.adblock]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

