[package]
name = "astra-browser"
version = "0.1.0"
description = "Astra Browser desktop application"
authors = ["Astra Browser"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["unstable", "specta", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# content-blocking — правила у форматі блокувальників Safari для WebKit у Linux (adblock.rs).
adblock = { version = "0.13.3", default-features = false, features = ["content-blocking", "css-validation", "embedded-domain-resolver", "full-regex-handling"] }
ureq = "3"
base64 = "0.22"
regex = "1"
tauri-plugin-dialog = "2"
# Розмір, положення й розгорнутість головного вікна між запусками.
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
# Повторний запуск і посилання з інших програм — у вже запущений браузер (launch.rs).
tauri-plugin-single-instance = "2"
# Журнал помилок у файлі (%LOCALAPPDATA%\com.astrabrowser.desktop\logs) — «Відкрити журнал» у довідці.
tauri-plugin-log = "2"
log = "0.4"
# Наскрізне шифрування паролів для синхронізації: AES-256-GCM і HMAC (сам ключ з пароля — PBKDF2 Windows, secure.rs).
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[dev-dependencies]
# Перевірка, що PBKDF2 Windows рахує так само, як незалежна реалізація.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# Звук, іконки й дозволи сайтів — через WebView2 напряму, повноекранне вікно — через Win32, Windows Hello — через WinRT
# (ті самі версії, що й у Tauri/wry).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
# Дочекатися відповіді Windows Hello (hello.rs) — та сама версія, що й у windows.
windows-future = "0.3"

# Linux: PBKDF2 і випадкові числа — без CNG Windows, а ключ, яким шифруються дані на диску, — у сховищі
# секретів системи (secure.rs).
[target.'cfg(not(windows))'.dependencies]
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Сайти під інтерфейсом у вікні (gtk_layers.rs) — ті самі версії, що й у Tauri/wry.
gtk = "0.18"
# v2_40 — скрипти й повідомлення сторінки в окремому світі (gtk_page.rs); стільки ж вимагає й wry.
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"
# Фільтри вмісту WebKit (gtk_adblock.rs): їх обгортка webkit2gtk не описує.
webkit2gtk-sys = "2.0"
# Функції WebKit новіші за обгортку — пошуком у вже завантажених бібліотеках (gtk_page::features).
libc = "0.2"
# Знімок сторінки (gtk_page::screenshot) — у PNG.
png = "0.18"
glib-sys = "0.18"
gio-sys = "0.18"
gobject-sys = "0.18"

# Рушій блокувальника реклами розбирає десятки тисяч правил — і в debug-збірці його варто оптимізувати.
[profile.dev.package.adblock]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

